name: Bug Report
description: Report a problem with the game
title: "[BUG]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug.
      placeholder: The game crashes after finishing a race.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game
        2. Join a race
        3. Finish race
        4. Crash occurs

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Android
        - iOS

  - type: input
    id: version
    attributes:
      label: Game version

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
