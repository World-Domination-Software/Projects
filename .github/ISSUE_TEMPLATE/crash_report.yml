name: "Crash report"
description: "Report a game crash, freeze, or fatal error."
labels: ["crash", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry you hit a crash. This form is focused on making crash reports as actionable as possible.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you playing on?
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - iOS
        - Steam Deck
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Game version / build
      description: Include the in-game version, build number, or branch (e.g. v0.3.1, playtest build).
      placeholder: "e.g. 0.3.1 (Steam), public test branch"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Short summary of the crash
      description: One or two sentences that describe when the crash happens.
      placeholder: "Game crashes to desktop when loading save file."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps before the crash
      description: List the actions leading up to the crash. Try to be specific.
      placeholder: |
        1. Launch the game
        2. Load save slot X
        3. Open the map
    validations:
      required: true

  - type: textarea
    id: frequency
    attributes:
      label: How often does it happen?
      description: Does this crash happen every time, sometimes, or only once?
      placeholder: "Every time I follow the steps" / "Happened once and I can't reproduce it"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash logs (optional)
      description: Paste crash logs, stack traces, or OS crash reports if you have them. Avoid sharing personal data.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context / screenshots
      description: Add any other details, screenshots, or video links that might help.
    validations:
      required: false
